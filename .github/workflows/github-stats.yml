name: Update GitHub statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-github-stats.mjs"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub statistics
        run: node scripts/update-github-stats.mjs
        env:
          # STATS_TOKEN = PAT classique (scopes: repo, read:org, read:user)
          # -> inclut repos privés + repos d'organisations. Sans lui : repos publics uniquement.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # INCLUDE_COLLABORATOR: "true"   # décommente pour inclure aussi les repos où tu es collaborateur

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats-dark.svg assets/github-stats-light.svg

          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "chore: update GitHub statistics [skip ci]"
            git pull --rebase
            git push
          fi
